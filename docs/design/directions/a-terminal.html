<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raisory · Direction A: Terminal</title>
<link rel="icon" href="../brand/logo/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../brand/tokens.css">
<script>try{var t=localStorage.getItem('raisory-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--text-base)/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--brand);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:2px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num,time,.am b{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:12px;height:12px;stroke-width:2.25}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}
.disp{font-family:var(--font-display);font-weight:600;letter-spacing:var(--tracking-display)}

/* Direction note + app bar */
.note{font-size:var(--text-xs);color:var(--muted);background:var(--surface-sunk);border-bottom:1px solid var(--line)}
.note .wrap{padding-top:4px;padding-bottom:4px}
.note b{color:var(--ink);font-weight:600}
.bar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:32px;height:48px}
.logo{display:block;border-radius:var(--radius-sm)}
.logo svg{display:block;height:22px;width:auto}
.lg-r{stroke:var(--brand)}.lg-d{fill:var(--accent)}.lg-t{fill:var(--ink)}
.nav{display:flex;gap:4px;height:100%}
.nav a{position:relative;display:flex;align-items:center;padding:0 8px;color:var(--muted);font-size:var(--text-sm);font-weight:500}
.nav a:hover{color:var(--ink);text-decoration:none}
.nav a[aria-current=page]{color:var(--ink)}
.nav a[aria-current=page]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--brand)}
.bar .sp{flex:1}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);font-size:var(--text-sm);font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--line-strong);background:var(--surface-sunk)}
.btn.on,.btn[aria-expanded=true]{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.btn:disabled{color:var(--muted);background:var(--surface-sunk);border-style:dashed;cursor:not-allowed}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-hover)}
.btn .ic.c{margin-right:-4px;color:var(--muted)}
.btn .badge{min-width:18px;height:18px;padding:0 4px;border-radius:var(--radius-pill);background:var(--brand);color:var(--on-brand);font-size:var(--text-xs);line-height:18px;text-align:center}
.link{border:0;background:none;padding:0;color:var(--brand);font-size:var(--text-sm);font-weight:500}
.link:hover{text-decoration:underline}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface-sunk)}
.seg button{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border:1px solid transparent;border-radius:4px;background:none;font-size:var(--text-sm);font-weight:500;color:var(--muted);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--surface);border-color:var(--line);color:var(--brand)}
.field{position:relative;display:inline-flex;align-items:center}
.field>.ic{position:absolute;left:10px;color:var(--muted);pointer-events:none}
.field input{width:100%;height:32px;padding:0 12px 0 32px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);font-size:var(--text-sm)}
.field input::placeholder{color:var(--muted)}
.field input:hover{border-color:var(--line-strong)}
.field input:focus{border-color:var(--brand);outline:none}
.field input:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.search{width:320px}
.search input{padding-right:40px}
kbd{font:500 var(--text-xs)/16px var(--font-ui);min-width:20px;text-align:center;padding:0 4px;border:1px solid var(--line-strong);border-radius:4px;background:var(--surface-sunk);color:var(--muted)}
.search kbd{position:absolute;right:8px}
.place{width:184px}
.sw{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 8px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);font-size:var(--text-sm);font-weight:500;white-space:nowrap}
.sw:hover{border-color:var(--line-strong)}
.sw i{position:relative;width:28px;height:16px;border-radius:var(--radius-pill);background:var(--line-strong);transition:background .15s ease-out}
.sw i::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--surface);transition:transform .15s ease-out}
.sw[aria-checked=true] i{background:var(--brand)}
.sw[aria-checked=true] i::after{transform:translateX(12px)}
.sel{position:relative;display:inline-flex;align-items:center}
.sel select{appearance:none;height:32px;padding:0 32px 0 12px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);font-size:var(--text-sm);font-weight:500}
.sel select:hover{border-color:var(--line-strong)}
.sel .ic{position:absolute;right:10px;color:var(--muted);pointer-events:none}
.pw{position:relative}
.pop{position:absolute;top:calc(100% + 8px);left:0;z-index:25;min-width:216px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-2)}
.pop.r{left:auto;right:0;width:288px;padding:16px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;height:32px;padding:0 8px;border:0;border-radius:var(--radius-sm);background:none;font-size:var(--text-sm);text-align:left}
.opt:hover{background:var(--surface-sunk)}
.opt[aria-pressed=true]{color:var(--brand);font-weight:500}
.opt .ic{visibility:hidden}.opt[aria-pressed=true] .ic{visibility:visible}
.grp+.grp{margin-top:16px}
.grp h3{margin-bottom:8px;font-size:var(--text-xs);font-weight:600;color:var(--muted)}
.cs{display:flex;flex-wrap:wrap;gap:8px}
.fine{margin-top:12px;font-size:var(--text-xs);color:var(--muted)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:1px solid var(--line);border-radius:var(--radius-pill);background:var(--surface);font-size:var(--text-sm);font-weight:500;color:var(--ink);white-space:nowrap}
.chip:hover{border-color:var(--line-strong)}
.chip .n{font-size:var(--text-xs);color:var(--muted);font-variant-numeric:tabular-nums}
.chip.z{color:var(--muted)}
.chip[aria-pressed=true]{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
.chip[aria-pressed=true] .n{color:inherit}
.chips{--fl:0px;--fr:48px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px;margin:0 -2px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 var(--fl),#000 calc(100% - var(--fr)),transparent);mask-image:linear-gradient(90deg,transparent,#000 var(--fl),#000 calc(100% - var(--fr)),transparent)}
.chips::-webkit-scrollbar{display:none}
.tag{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 6px 0 10px;border:0;border-radius:var(--radius-pill);background:var(--brand-soft);color:var(--brand);font-size:var(--text-xs);font-weight:500;white-space:nowrap}
.tag:hover{background:color-mix(in srgb,var(--brand) 18%,var(--surface))}
.st{--t:0%;display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px;border-radius:var(--radius-sm);background:color-mix(in srgb,var(--data-3) var(--t),var(--surface));color:var(--ink);font-size:var(--text-xs);font-weight:500;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--data-3)}
.st.u{background:var(--surface-sunk);color:var(--muted)}
.st.u::before{background:none;border:1px solid var(--muted)}
.cc{display:inline-block;padding:0 4px;border:1px solid var(--line-strong);border-radius:4px;font-size:var(--text-xs);font-weight:600;line-height:16px;letter-spacing:.04em;color:var(--ink)}
.mono{--c:var(--data-1);display:grid;place-items:center;flex:none;width:24px;height:24px;border-radius:var(--radius-sm);background:color-mix(in srgb,var(--c) 16%,var(--surface));color:color-mix(in srgb,var(--c) 60%,var(--ink));font-size:var(--text-xs);font-weight:600;line-height:1}
.mono.m{width:32px;height:32px;font-size:var(--text-sm)}
.mono.l{width:56px;height:56px;border-radius:var(--radius);font:600 var(--text-lg)/1 var(--font-display)}
.ok{display:inline-flex;align-items:center;gap:2px;color:var(--up);font-weight:500}
.new{display:inline-flex;align-items:center;gap:4px;color:var(--accent-ink);font-size:var(--text-xs);font-weight:600}
.new::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}

/* Funding page */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:24px 0 16px}
.ph h1{font:600 var(--text-xl)/1.2 var(--font-display);letter-spacing:var(--tracking-display)}
.ph p{margin-top:4px;font-size:var(--text-sm);color:var(--muted)}
.secs{padding-bottom:12px}
.fbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.fbar .seg{margin-right:8px}
.fbar .pw:last-child{margin-left:auto}
.lt{display:flex;align-items:center;gap:8px;min-height:56px;padding:8px 0}
.applied{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:1;min-width:0}
.lt-r{display:flex;gap:8px;margin-left:auto}
.applied:empty::before{content:"No filters applied";font-size:var(--text-xs);color:var(--muted)}
.mc{display:none}
#h-funding:focus{outline:none}
#fbtn{display:none}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.lh,.row{display:grid;grid-template-columns:24px minmax(0,1fr) 120px 168px 152px 160px 96px;grid-template-areas:"mo nm st sc pl am wh" "mo ds st sc pl am wh";column-gap:16px;align-items:center;padding:0 16px}
.lh{position:sticky;top:48px;z-index:5;grid-template-areas:"co co st sc pl am wh";height:32px;border-bottom:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0;background:var(--surface-sunk);font-size:var(--text-xs);font-weight:500;color:var(--muted)}
.lh .co{grid-area:co}.lh .r{text-align:right}
.rows li+li .row{border-top:1px solid var(--line)}
.rows li:last-child .row{border-radius:0 0 var(--radius) var(--radius)}
.row{min-height:56px;padding-top:8px;padding-bottom:8px;row-gap:2px;color:var(--ink);scroll-margin:96px}
.row:hover,.row:focus-visible{background:var(--surface-sunk);text-decoration:none}
.row:focus-visible{outline-offset:-2px}
.row .mono{grid-area:mo}
.nm{grid-area:nm;display:flex;align-items:baseline;gap:8px;min-width:0;font-size:var(--text-base);font-weight:500;line-height:20px}
.nm .t{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.leads{flex:none;font-size:var(--text-xs);font-weight:400;color:var(--muted);opacity:0;transition:opacity .12s ease-out;white-space:nowrap}
.row:hover .leads,.row:focus-visible .leads{opacity:1}
.ds{grid-area:ds;overflow:hidden;font-size:var(--text-sm);line-height:18px;color:var(--muted);white-space:nowrap;text-overflow:ellipsis}
.row .st{grid-area:st;justify-self:start}
.sc{grid-area:sc;overflow:hidden;font-size:var(--text-sm);white-space:nowrap;text-overflow:ellipsis}
.pend{color:var(--muted)}
.pl{grid-area:pl;display:flex;align-items:center;gap:8px;min-width:0;font-size:var(--text-sm);white-space:nowrap}
.pl span:last-child{overflow:hidden;text-overflow:ellipsis}
.am{grid-area:am;text-align:right;line-height:1.25}
.am b{display:block;font:600 var(--text-md)/22px var(--font-display);letter-spacing:var(--tracking-display)}
.am small{display:flex;justify-content:flex-end;gap:8px;font-size:var(--text-xs);color:var(--muted)}
.wh{grid-area:wh;display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-size:var(--text-sm);color:var(--muted)}
.lf{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 0 64px;font-size:var(--text-xs);color:var(--muted)}
.lf span{display:inline-flex;gap:6px;align-items:center}
.empty{padding:48px 16px;text-align:center}
.empty p+p{margin-top:4px;font-size:var(--text-sm);color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:12px;height:100%;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);color:var(--ink)}
.card:hover{border-color:var(--line-strong);text-decoration:none}
.cd-h{display:flex;gap:12px;align-items:center}
.cd-h>div{flex:1;min-width:0}
.cd-h .t{display:block;font-weight:500;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cd-h .pl{font-size:var(--text-xs);color:var(--muted)}
.cd-d{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:var(--text-sm);color:var(--muted);min-height:40px}
.cd-m{display:flex;gap:8px;align-items:center;min-width:0}
.cd-f{display:flex;justify-content:space-between;align-items:flex-end;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.cd-f .am{text-align:left}.cd-f .am b{font-size:var(--text-xl);line-height:28px}.cd-f .am small{justify-content:flex-start}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--brand-deep) 45%,transparent)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;display:flex;flex-direction:column;max-height:88vh;background:var(--surface);border-top:1px solid var(--line);border-radius:var(--radius-lg) var(--radius-lg) 0 0;box-shadow:var(--shadow-2);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sh-h{display:flex;align-items:center;justify-content:space-between;padding:16px;border-bottom:1px solid var(--line)}
.sh-h h2{font:600 var(--text-md)/1 var(--font-display);letter-spacing:var(--tracking-display)}
.sh-b{flex:1;overflow:auto;padding:16px}
.sh-b .grp+.grp{margin-top:24px}
.sh-b .place{width:100%}
.sh-f{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 16px;border-top:1px solid var(--line)}
.icon-btn{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--surface);color:var(--ink)}
.icon-btn:hover{background:var(--surface-sunk)}

/* Company page */
.crumbs{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;font-size:var(--text-sm)}
.crumbs a{display:inline-flex;align-items:center;gap:6px;font-weight:500}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:32px;align-items:start;padding-bottom:64px}
.chead{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:16px;align-items:start}
.chead h1{font:600 var(--text-2xl)/1.15 var(--font-display);letter-spacing:var(--tracking-display)}
.chead h1:focus{outline:none}
.cdesc{margin-top:8px;max-width:62ch}
.cmeta{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;margin-top:12px;font-size:var(--text-sm);color:var(--muted)}
.cmeta>span{display:inline-flex;align-items:center;gap:8px}
.web{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:var(--text-xs);color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;margin-top:24px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.fact{padding:12px 16px;background:var(--surface)}
.fact dt{font-size:var(--text-xs);color:var(--muted)}
.fact dd{margin-top:4px;font:600 var(--text-md)/1.25 var(--font-display);letter-spacing:var(--tracking-display);font-variant-numeric:tabular-nums}
.fact dd.pend{font:400 var(--text-sm)/1.4 var(--font-ui);color:var(--muted);letter-spacing:0}
.fact .sub{display:block;margin-top:2px;font-size:var(--text-xs);color:var(--muted)}
.sec{margin-top:32px}
.sec>h2,.sec-h h2{margin-bottom:12px;font:600 var(--text-md)/1.3 var(--font-display);letter-spacing:var(--tracking-display)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:16px}
.sec-h span{font-size:var(--text-xs);color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.lr{margin-top:16px}
.lr-h{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 24px;border-bottom:1px solid var(--line)}
.lr-h h2{font:600 var(--text-sm)/1.3 var(--font-ui);letter-spacing:0}
.lr-b{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:24px}
.big{display:block;font:600 var(--text-3xl)/1 var(--font-display);letter-spacing:var(--tracking-display);font-variant-numeric:tabular-nums}
.lr-o{display:block;margin-top:8px;font-size:var(--text-sm);color:var(--muted)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 24px}
.kv dt{font-size:var(--text-xs);color:var(--muted)}
.kv dd{margin-top:2px;font-size:var(--text-sm);font-weight:500}
.kv dd .muted{font-weight:400}
.lr-s{display:flex;gap:8px;align-items:flex-start;padding:12px 24px;border-top:1px solid var(--line);font-size:var(--text-sm)}
.lr-s .ic{margin-top:2px}
.lr-s.y .ic,.lr-s.y b{color:var(--up)}
.lr-s.n .ic,.lr-s.n b{color:var(--warn)}
.tl li{display:grid;grid-template-columns:112px minmax(0,1fr) 88px;gap:16px;align-items:center;padding:16px}
.tl li+li{border-top:1px solid var(--line)}
.tl-d{display:flex;align-items:center;gap:8px;font-size:var(--text-sm);color:var(--muted)}
.tl-d::before{content:"";width:8px;height:8px;border-radius:50%;border:2px solid var(--muted)}
.tl-m{display:flex;flex-direction:column;gap:8px;min-width:0}
.tl-l{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:var(--text-sm);font-weight:500}
.tl-l .muted{font-weight:400}
.meter{height:8px;border-radius:var(--radius-pill);background:var(--surface-sunk);overflow:hidden}
.meter span{display:block;height:100%;border-radius:inherit;background:var(--muted)}
.tl-a{text-align:right;font:600 var(--text-md)/1 var(--font-display);letter-spacing:var(--tracking-display);font-variant-numeric:tabular-nums}
.inv li{display:flex;align-items:center;gap:12px;padding:12px 16px;font-size:var(--text-sm);font-weight:500}
.inv li+li{border-top:1px solid var(--line)}
.inv .nmx{flex:1;min-width:0}
.role{font-size:var(--text-xs);font-weight:500;color:var(--muted)}
.role.lead{padding:0 8px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);line-height:20px;color:var(--ink)}
.about{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px 16px;padding:16px;font-size:var(--text-sm)}
.about dt{color:var(--muted)}
.about .cs{gap:6px}
.th{display:inline-flex;align-items:center;height:24px;padding:0 8px;border:1px solid var(--line);border-radius:var(--radius-sm);font-size:var(--text-xs);font-weight:500}
.srcs li{display:flex;gap:12px;padding:12px 16px}
.srcs li+li{border-top:1px solid var(--line)}
.srcs .ic{margin-top:3px;color:var(--muted)}
.srcs p{font-size:var(--text-sm);font-weight:500}
.srcs p+p{margin-top:2px;font-size:var(--text-xs);font-weight:400;color:var(--muted)}
.fs{position:sticky;top:64px}
.fs-h{padding:16px;border-bottom:1px solid var(--line)}

<h1 id="h-co" tabindex="-1">${esc(c.name)}</h1>
<p class="cdesc">${esc(c.description)}</p>
<div class="cmeta"><span>${loc}</span><span>${esc(c.sector)}</span>${reg?`<span class="dot">${esc(reg.status)} at Companies House</span>`:'<span>Registry status not known</span>'}</div>
</div>
<div class="web"><button type="button" class="btn" disabled>${ic('ext')}Visit website</button><span>Website not found yet</span></div>
</header>
<dl class="facts">
${fact('Last round',esc(r0.stage),fd(r0.date))}
${fact('Total raised',esc(c.totalRaised),'All recorded rounds')}
${fact('Last round size',esc(r0.gbp),esc(r0.original)+' reported')}
${fact('Founded',fy?esc(fy):'Not known yet',fage?cap(strip(fage)):'',!fy)}
${fact('Company size',sz?esc(sz):'No registry match',szn?cap(strip(szn)).replace('Accounts made up to','Accounts to'):'',!sz)}
${fact('Investors',inv.length,ld.length+' lead'+(ld.length===1?'':'s'))}
</dl>
<section class="box lr" aria-labelledby="h-lr">
<div class="lr-h"><h2 id="h-lr">Latest round</h2>${stage(r0.stage)}</div>
<div class="lr-b">
<div><span class="big">${esc(r0.gbp)}</span><span class="lr-o">${esc(r0.original)} as reported</span></div>
<dl class="kv">
<div><dt>Announced</dt><dd><time datetime="${r0.date}">${fd(r0.date)}</time> <span class="muted">${rel(r0.date)}</span></dd></div>
<div><dt>Led by</dt><dd>${ld.length?ld.map(i=>esc(i.name)).join(', '):'<span class="muted">No lead reported</span>'}</dd></div>
<div class="nm-m"><dt>Company age at round</dt><dd>${r0.companyAge?esc(r0.companyAge):'<span class="muted">Not known</span>'}</dd></div>
<div class="nm-m"><dt>Change on last round</dt><dd><span class="muted">No earlier round recorded</span></dd></div>
</dl>
</div>
${r0.confirmed?`<p class="lr-s y">${ic('check')}<span><b>Confirmed.</b> ${esc(r0.confirmed)}</span></p>`
:`<p class="lr-s n">${ic('clock')}<span><b>Not yet confirmed.</b> No official filing found. Reported by ${r0.sources.length} source${r0.sources.length===1?'':'s'}.</span></p>`}
</section>
<section class="sec s-hist" aria-labelledby="h-hist">
<div class="sec-h"><h2 id="h-hist">Funding history</h2><span>${c.rounds.length} round${c.rounds.length===1?'':'s'} recorded</span></div>
<ol class="box tl">${c.rounds.map(r=>`<li>
<span class="tl-d"><time datetime="${r.date}">${fd(r.date)}</time></span>
<div class="tl-m"><span class="tl-l">${r.label!==r.stage?esc(r.label)+' ':''}${stage(r.stage)} <span class="muted">${r.investors.length} investor${r.investors.length===1?'':'s'}</span></span>
<div class="meter" role="img" aria-label="${esc(r.gbp)}"><span style="width:${Math.max(4,gbp(r.gbp)/max*100)}%"></span></div></div>
<span class="tl-a">${esc(r.gbp)}</span></li>`).join('')}</ol>
<p class="fine">${esc(c.momentum||'History starts in November 2026, so earlier rounds may be missing.')}</p>
</section>
<section class="sec s-inv" aria-labelledby="h-inv">
<div class="sec-h"><h2 id="h-inv">Investors</h2><span>In the latest round</span></div>
<ul class="box inv">${[...ld,...inv.filter(i=>i.role!=='lead')].map(i=>`<li>${mono(i.name,i.name)}<span class="nmx">${esc(i.name)}</span><span class="role ${i.role}">${i.role==='lead'?'Lead':'Participant'}</span></li>`).join('')}</ul>
</section>
<section class="sec s-about" aria-labelledby="h-about">
<h2 id="h-about">Sector and themes</h2>
<dl class="box about">
<dt>Sector</dt><dd><a href="#funding" data-a="gosec" data-v="${esc(c.sector)}">${esc(c.sector)}</a></dd>
<dt>Themes</dt><dd class="cs">${c.themes.map(t=>`<span class="th">${esc(t)}</span>`).join('')}</dd>
</dl>
</section>
<section class="sec s-src" aria-labelledby="h-src">
<div class="sec-h"><h2 id="h-src">Sources</h2><span>${r0.sources.length} report${r0.sources.length===1?'':'s'}</span></div>
<ul class="box srcs">${c.rounds.flatMap(r=>r.sources).map(s=>`<li>${ic('doc')}<div><p>${esc(s.title)}</p><p>${esc(s.outlet)} · <time datetime="${s.date}">${fd(s.date)}</time></p></div></li>`).join('')}</ul>
</section>
</div>
<aside class="box fs" aria-labelledby="h-fs">
<div class="fs-h"><h2 id="h-fs">Fact sheet</h2><p>${ic('bld')}From official records</p></div>
${reg?`<dl>
<div><dt>Company number</dt><dd class="num">${esc(reg.companyNumber)}</dd></div>
<div><dt>Status</dt><dd><span class="dot">${esc(reg.status)}</span></dd></div>
<div><dt>Type</dt><dd>${esc(reg.type)}</dd></div>
<div><dt>Incorporated</dt><dd class="num">${esc(reg.incorporated)}</dd></div>
<div><dt>SIC code</dt><dd>${reg.sic.map(s=>`<span class="num">${esc(s.code)}</span><small>${esc(s.label)}</small>`).join('')}</dd></div>
<div><dt>Accounts</dt><dd>${esc(sz)}<small>${esc(cap(strip(szn)))}</small></dd></div>
<div><dt>Registered office area</dt><dd>${esc(reg.registeredOfficeArea)}</dd></div>
</dl><p class="fs-f">Source: ${esc(reg.source)}</p>`
:`<div class="none">${ic('bld')}<h3>No Companies House match yet</h3><p>We haven't matched ${esc(c.name)} to a Companies House record, so there is no company number, status or accounts to show. Everything on this page comes from news reports.</p></div>`}
</aside>
</div></div>`;
}
function notice(name,title){
return `<div class="wrap"><div class="notice">
<h1 tabindex="-1">${title||'Prototype: only two company pages are built'}</h1>
<p>${name?esc(name)+"'s page is not part of this prototype.":'This page is not part of this prototype.'} These two are:</p>
<ul>
<li><a href="#company/pro-climbing-league">${mono('Pro Climbing League','pro-climbing-league')}Pro Climbing League <span class="muted">rich: confirmed, registry facts, four investors</span></a></li>
<li><a href="#company/griffin">${mono('Griffin','griffin')}Griffin <span class="muted">sparse: news only, no registry match</span></a></li>
</ul>
<p><a href="#funding">Back to Funding</a></p>
</div></div>`;
}

/* Router */
let cur=null,saveY=0;
function route(){
const h=decodeURIComponent(location.hash.slice(1))||'funding',[p,slug]=h.split('/'),f=p==='funding';
if(cur==='funding'&&!f)saveY=scrollY;
const prev=cur;cur=f?'funding':h;
$('#pg-funding').hidden=!f;$('#pg-other').hidden=f;
$$('[data-nav]').forEach(a=>a.toggleAttribute('aria-current',a.dataset.nav===(f||p==='company'?'funding':p)));
$$('[data-nav]').forEach(a=>a.hasAttribute('aria-current')&&a.setAttribute('aria-current','page'));
if(f){
document.title='Funding · Raisory';
scrollTo(0,saveY);fade();
if(prev)$('#h-funding').focus({preventScroll:true});
}else{
const c=p==='company'&&D.companies[slug];
$('#pg-other').innerHTML=p==='company'?company(slug):notice(null,'Prototype: '+esc(cap(p))+' is not built');
document.title=(c?c.name:'Prototype')+' · Raisory';
scrollTo(0,0);
if(prev)$('#pg-other h1')?.focus({preventScroll:true});
}
}

/* Events */
document.addEventListener('click',e=>{
const t=e.target.closest('[data-a]');
if(!t){if(S.pop&&!e.target.closest('.pw')){S.pop=null;renderControls()}return}
const a=t.dataset.a,v=t.dataset.v;
if(a!=='pop'&&!t.closest('.pop'))S.pop=null;
switch(a){
case 'theme':setTheme(TH[(TH.indexOf(theme)+1)%3]);return;
case 'sheet':sheet(v==='1');return;
case 'pop':S.pop=S.pop===v?null:v;renderControls();return;
case 'sec':if(!v)S.sec.clear();else S.sec.has(v)?S.sec.delete(v):S.sec.add(v);break;
case 'stage':S.stage=v;break;
case 'amt':S.amt=v;break;
case 'date':S.date=v;break;
case 'conf':S.conf=!S.conf;break;
case 'more':S.more.has(v)?S.more.delete(v):S.more.add(v);break;
case 'rm':removeF(v);break;
case 'clear':clearAll();break;
case 'view':S.view=v;break;
case 'gosec':clearAll();S.sec.add(v);saveY=0;break;
}
renderSectors();renderControls();update();
});
document.addEventListener('input',e=>{
if(e.target.id==='q'){S.q=e.target.value;renderSectors();update()}
else if(e.target.matches('[data-place]')){S.place=e.target.value;$$('[data-place]').forEach(i=>i!==e.target&&(i.value=S.place));renderSectors();update()}
});
$('#sort').addEventListener('change',e=>{S.sort=e.target.value;update()});
$('#secs').addEventListener('scroll',fade,{passive:true});
addEventListener('resize',fade);
document.addEventListener('keydown',e=>{
const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
if(e.key==='Escape'){
if(!$('#sheet').hidden)return sheet(false);
if(S.pop){S.pop=null;renderControls();return}
if(typing)e.target.blur();
return;
}
if(typing||e.metaKey||e.ctrlKey||e.altKey||cur!=='funding'||!$('#sheet').hidden)return;
if(e.key==='/'){e.preventDefault();$('#q').focus();$('#q').select()}
else if(e.key==='j'||e.key==='k'){
const it=$$('#out a.row,#out a.card'),i=it.indexOf(document.activeElement);
const n=e.key==='j'?Math.min(i+1,it.length-1):Math.max(i-1,0);
if(it[n]){e.preventDefault();it[n].focus()}
}
});
$('#sheet').addEventListener('keydown',e=>{
if(e.key!=='Tab')return;
const f=$$('#sheet button,#sheet input'),first=f[0],last=f[f.length-1];
if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
});
addEventListener('hashchange',route);

setTheme(theme);renderSectors();renderControls();update();route();
</script>
</body>
</html>
