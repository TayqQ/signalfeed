# Runs the pipeline hourly. EU-Startups only keeps about a day of items, so a
# longer gap can lose data (docs/sources.md, A3).
#
# GitHub disables scheduled workflows after 60 days with no repository activity
# (A13). If that happens, re-enable this workflow from the Actions tab.
#
# Set the repository variable INGEST_ENABLED to anything but "true" to stop it.
# With no OPENAI_API_KEY secret, runs still collect and keep items for later.
name: Ingest

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    if: vars.INGEST_ENABLED == 'true'
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EXTRACTION_MODEL: ${{ vars.EXTRACTION_MODEL }}
      LLM_MONTHLY_CAP_GBP: ${{ vars.LLM_MONTHLY_CAP_GBP }}
      HTTP_CONTACT: ${{ vars.HTTP_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run the pipeline
        run: |
          set -o pipefail
          pnpm --silent ingest run --trigger schedule | tee summary.json
      - name: Write the step summary
        if: always()
        run: |
          [ -s summary.json ] || exit 0
          node -e '
            const s = JSON.parse(require("fs").readFileSync("summary.json", "utf8"));
            const t = s.stats;
            const rows = t
              ? [
                  ["Status", s.status],
                  ["New items", t.collect.itemsInserted],
                  ["Feeds failed", t.collect.sourcesFailed],
                  ["Filtered out", t.prefilter.itemsFilteredOut],
                  ["Extracted", t.extract.skipped ? "skipped: no key" : t.extract.itemsExtracted],
                  ["Events created", t.resolve.eventsCreated],
                  ["Run spend (USD micros)", t.spendUsdMicros],
                ]
              : [["Ran", String(s.ran)]];
            const lines = ["| Step | Result |", "|---|---|", ...rows.map(([a, b]) => `| ${a} | ${b} |`)];
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
