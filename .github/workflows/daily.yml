# Runs the daily jobs (docs/spec-phase2.md section 10.2, docs/spec-phase3.md
# section 6), in this order:
#   1. new Innovate UK grants from UKRI Gateway to Research
#   2. Companies House linking and profile refresh (needs COMPANIES_HOUSE_API_KEY)
#   3. SEC Form D filings from EDGAR (needs an email address in HTTP_CONTACT)
# None of them needs OPENAI_API_KEY. Each step has its own timeout. The hourly run tags and resolves what the
# grants step collects. A failing step does not skip the ones after it.
#
# It shares the "ingest" concurrency group with the hourly workflow, so the two
# never overlap. Each command also takes the pipeline's database lock.
#
# Set the repository variable INGEST_ENABLED to anything but "true" to stop it.
# Set REGISTRY_ENABLED or FORMD_ENABLED to "false" to pause one step.
name: Daily

on:
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  grants:
    name: Daily jobs
    runs-on: ubuntu-latest
    if: vars.INGEST_ENABLED == 'true'
    # Each step has its own budget so a slow one cannot starve the rest:
    # grants 25 minutes, Companies House 25, Form D 15, plus setup. At the
    # default limits grants takes about 9 minutes (1,500 organisations at
    # 3 requests a second), registry about 21 and Form D about 10.
    timeout-minutes: 75
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      EXTRACTION_MODEL: ${{ vars.EXTRACTION_MODEL }}
      LLM_MONTHLY_CAP_GBP: ${{ vars.LLM_MONTHLY_CAP_GBP }}
      HTTP_CONTACT: ${{ vars.HTTP_CONTACT }}
      GTR_REQUESTS_PER_SECOND: ${{ vars.GTR_REQUESTS_PER_SECOND }}
      MAX_GRANT_ORG_FETCHES_PER_RUN: ${{ vars.MAX_GRANT_ORG_FETCHES_PER_RUN }}
      MAX_CH_REQUESTS_PER_RUN: ${{ vars.MAX_CH_REQUESTS_PER_RUN }}
      MAX_EDGAR_DAYS_PER_RUN: ${{ vars.MAX_EDGAR_DAYS_PER_RUN }}
      MAX_EDGAR_REQUESTS_PER_RUN: ${{ vars.MAX_EDGAR_REQUESTS_PER_RUN }}
      TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Collect grants
        timeout-minutes: 25
        run: |
          set -o pipefail
          pnpm --silent ingest grants --trigger "$TRIGGER" | tee grants.json
      - name: Link companies to Companies House
        # Runs when an earlier step failed, but not after a cancel.
        if: ${{ !cancelled() && vars.REGISTRY_ENABLED != 'false' }}
        timeout-minutes: 25
        # The key goes to this step only. Without it the run is recorded as
        # skipped and the step succeeds.
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
        run: |
          set -o pipefail
          pnpm --silent ingest registry --trigger "$TRIGGER" | tee registry.json
      - name: Collect SEC Form D filings
        if: ${{ !cancelled() && vars.FORMD_ENABLED != 'false' }}
        timeout-minutes: 15
        run: |
          set -o pipefail
          pnpm --silent ingest formd --trigger "$TRIGGER" | tee formd.json
      - name: Write the step summary
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const read = (file) => {
              try {
                const text = fs.readFileSync(file, "utf8").trim();
                return text ? JSON.parse(text) : null;
              } catch {
                return null;
              }
            };
            const sum = (counts) => Object.values(counts || {}).reduce((a, n) => a + (n || 0), 0);
            // A missing step result means that step failed; the run error says why.
            const rebuilt = (step) => (step ? (step.skipped ? "skipped: no change" : "rebuilt") : "failed");
            const table = (title, s, rows) => {
              const body = !s
                ? [["Result", "not run, or stopped before a summary (see the log)"]]
                : !s.ran
                  ? [["Ran", "no: another run held the lock"]]
                  : [["Status", s.status], ...rows(s.stats || {})];
              return [`### ${title}`, "", "| Step | Result |", "|---|---|", ...body.map(([a, b]) => `| ${a} | ${b} |`), ""];
            };
            const lines = [
              ...table("Grants", read("grants.json"), (t) => {
                const g = t.grantCollect;
                if (!g) return [];
                return [
                  ["Pages fetched", g.pagesFetched],
                  ["Projects found", g.projectsFound],
                  ["New projects", g.projectsInserted],
                  ["New participants", g.participantsInserted],
                  ["Participants skipped (not organisations)", g.participantsSkipped],
                  ["Organisations skipped (name not a company form)", g.orgsSkipped ?? 0],
                  ["Organisations fetched", g.orgsFetched],
                  ["Organisations failed", g.orgsFailed],
                ];
              }),
              ...table("Companies House", read("registry.json"), (t) => {
                const r = t.registry;
                if (!r) return [["Registry", "failed"], ["Confirmations", rebuilt(t.confirm)], ["Locations", rebuilt(t.locations)], ["Sectors", rebuilt(t.sectors)]];
                if (r.skipped) return [["Registry", "skipped: no COMPANIES_HOUSE_API_KEY"]];
                return [
                  ["Companies searched", r.companiesSearched],
                  ["Linked", sum(r.linkedByMethod)],
                  ["Candidates for review", r.candidates],
                  ["Links demoted to review", r.linksDemoted ?? 0],
                  ["Profiles fetched", r.profilesFetched],
                  ["Profiles refreshed", r.profilesRefreshed],
                  ["SH01 filings stored", r.filingsStored],
                  ["Requests", r.requests],
                  ["Stopped early", r.rateLimited ? "rate limited" : r.stoppedAtLimit ? "request limit" : "no"],
                  ["Confirmations", rebuilt(t.confirm)],
                  ["Ambiguous records", t.confirm ? (t.confirm.ambiguousRecords ?? 0) : "-"],
                  ["Locations", rebuilt(t.locations)],
                  ["Sectors", rebuilt(t.sectors)],
                ];
              }),
              ...table("SEC Form D", read("formd.json"), (t) => {
                const f = t.formD;
                if (!f) return [["Form D", "failed"]];
                return [
                  ["Index days fetched", f.daysFetched],
                  ["Days with no index", f.daysMissing],
                  ["Filings stored", f.filingsStored],
                  ["Funds skipped", f.fundsSkipped],
                  ["Parse failures", f.parseFailures],
                  ["Linked by CIK", f.linkedByCik],
                  ["Linked by name", f.linkedByName],
                  ["Candidates for review", f.candidates],
                  ["Requests", f.requests],
                  ["Confirmations", rebuilt(t.confirm)],
                  ["Ambiguous records", t.confirm ? (t.confirm.ambiguousRecords ?? 0) : "-"],
                ];
              }),
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          '
